name: yara

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: yara
      POSTGRES_USER: yara
      POSTGRES_PASSWORD: yara_local_only
    ports:
      - '5432:5432'
    volumes:
      - yara-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yara -d yara']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    command: ['node', 'packages/adapters-postgres/dist/migrate.js']
    environment:
      DATABASE_URL: postgresql://yara:yara_local_only@postgres:5432/yara
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://yara:yara_local_only@postgres:5432/yara
      LOG_LEVEL: info
      MODEL_PROVIDER: ${MODEL_PROVIDER:-disabled}
      MODEL_NAME: ${MODEL_NAME:-gpt-5-mini}
      YARA_ACTOR_REF: ${YARA_ACTOR_REF:-user:yara:local}
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    environment:
      NODE_ENV: development
      WORKER_HEALTH_PORT: 4001
      DATABASE_URL: postgresql://yara:yara_local_only@postgres:5432/yara
      LOG_LEVEL: info
      MODEL_PROVIDER: ${MODEL_PROVIDER:-disabled}
      MODEL_NAME: ${MODEL_NAME:-gpt-5-mini}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-30000}
      WORKER_ID: worker:compose
      AI_JOB_POLL_MS: 500
      AI_JOB_LEASE_MS: 45000
      AI_JOB_HEARTBEAT_MS: 10000
    ports:
      - '4001:4001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    environment:
      NODE_ENV: production
      WEB_PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      API_INTERNAL_BASE_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  yara-postgres:
